<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CNAEs - Ludas Legal</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --azul-institucional: #0056b3;
            --cinza-texto: #333333;
            --cinza-borda: #eaeaea; /* Borda bem clarinha igual ao print */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: 'Open Sans', sans-serif;
            color: var(--cinza-texto);
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Título idêntico ao seu print */
        #tituloSecao {
            font-size: 24px;
            font-weight: 300;
            color: #444444;
            margin-bottom: 30px;
        }
        #tituloSecao strong {
            color: var(--azul-institucional);
            font-weight: 700;
        }

        /* Botões de Filtro (Categorias) */
        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 30px;
        }
        .btn-filtro {
            padding: 8px 16px;
            background: #ffffff;
            border: 1px solid var(--cinza-borda);
            border-radius: 4px;
            color: #666666;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-filtro:hover {
            border-color: #cccccc;
        }
        .btn-filtro.ativo {
            background: var(--azul-institucional);
            color: #ffffff;
            border-color: var(--azul-institucional);
        }

        /* Campo de Busca */
        .busca-input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--cinza-borda);
            border-radius: 4px;
            font-size: 15px;
            margin-bottom: 20px;
            font-family: inherit;
            outline: none;
        }
        .busca-input:focus {
            border-color: var(--azul-institucional);
        }

        /* Lista de CNAEs */
        #lista-cnaes {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Espaçamento entre os retângulos */
        }

        /* Retângulo do CNAE idêntico ao seu print */
        .item-cnae {
            background: #ffffff;
            border: 1px solid var(--cinza-borda);
            border-radius: 6px;
            padding: 18px 20px;
            text-decoration: none;
            display: block;
            transition: box-shadow 0.2s;
        }
        .item-cnae:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        /* Texto azul em caixa alta igual ao print */
        .texto-cnae {
            color: var(--azul-institucional);
            font-weight: 600;
            font-size: 15px;
            text-transform: uppercase;
            line-height: 1.4;
        }

        .mensagem-vazia {
            color: #888888;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    
    <input type="text" id="campoBusca" class="busca-input" placeholder="Digite uma palavra-chave ou o número do CNAE..." oninput="filtrar()">

    <div class="filtros">
        <button class="btn-filtro" onclick="selecionarCategoria('Administração', this)">Administração</button>
        <button class="btn-filtro" onclick="selecionarCategoria('Tecnologia', this)">Tecnologia</button>
        <button class="btn-filtro" onclick="selecionarCategoria('Saúde', this)">Saúde</button>
        <button class="btn-filtro" onclick="selecionarCategoria('Comércio', this)">Comércio</button>
        <button class="btn-filtro" onclick="selecionarCategoria('Engenharia', this)">Engenharia</button>
    </div>

    <h2 id="tituloSecao">CNAEs disponíveis</h2>
    
    <div id="lista-cnaes">
        </div>

</div>

<script>
    // Banco de Dados Limpo
    const cnaes = [
        { codigo: "8211-3/00", descricao: "SERVIÇOS COMBINADOS DE ESCRITÓRIO E APOIO ADMINISTRATIVO", categoria: "Administração" },
        { codigo: "8219-9/99", descricao: "PREPARAÇÃO DE DOCUMENTOS E SERVIÇOS ESPECIALIZADOS DE APOIO ADMINISTRATIVO NÃO ESPECIFICADOS ANTERIORMENTE", categoria: "Administração" },
        { codigo: "6201-5/01", descricao: "DESENVOLVIMENTO DE PROGRAMAS DE COMPUTADOR SOB ENCOMENDA", categoria: "Tecnologia" },
        { codigo: "8630-5/99", descricao: "ATIVIDADES DE ATENÇÃO AMBULATORIAL NÃO ESPECIFICADAS", categoria: "Saúde" },
        { codigo: "4711-3/02", descricao: "COMÉRCIO VAREJISTA DE MERCADORIAS EM GERAL", categoria: "Comércio" },
        { codigo: "4321-5/00", descricao: "INSTALAÇÃO E MANUTENÇÃO ELÉTRICA", categoria: "Engenharia" }
    ];

    let categoriaAtual = "";

    // Inicia a página mostrando a mensagem padrão
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("lista-cnaes").innerHTML = '<p class="mensagem-vazia">Selecione uma categoria acima ou faça uma busca.</p>';
    });

    function selecionarCategoria(nomeCategoria, botaoClicado) {
        // Se clicar na categoria que já está ativa, ele desmarca
        if (categoriaAtual === nomeCategoria) {
            categoriaAtual = "";
            botaoClicado.classList.remove("ativo");
            document.getElementById("tituloSecao").innerHTML = "CNAEs disponíveis";
        } else {
            // Remove a classe "ativo" de todos os botões e coloca só no clicado
            document.querySelectorAll(".btn-filtro").forEach(b => b.classList.remove("ativo"));
            botaoClicado.classList.add("ativo");
            categoriaAtual = nomeCategoria;
            // Título formatado exatamente como no seu print
            document.getElementById("tituloSecao").innerHTML = `CNAEs disponíveis para: <strong>${nomeCategoria}</strong>`;
        }
        filtrar();
    }

    function removerAcentos(texto) {
        return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function filtrar() {
        const termoBusca = removerAcentos(document.getElementById("campoBusca").value);
        const containerLista = document.getElementById("lista-cnaes");
        
        // Se não tiver busca nem categoria, pede pra selecionar
        if (termoBusca === "" && categoriaAtual === "") {
            containerLista.innerHTML = '<p class="mensagem-vazia">Selecione uma categoria acima ou faça uma busca.</p>';
            return;
        }

        // Filtra os dados
        const resultados = cnaes.filter(item => {
            const bateTexto = removerAcentos(item.codigo).includes(termoBusca) || removerAcentos(item.descricao).includes(termoBusca);
            const bateCategoria = categoriaAtual === "" || item.categoria === categoriaAtual;
            return bateTexto && bateCategoria;
        });

        // Monta o visual na tela
        if (resultados.length === 0) {
            containerLista.innerHTML = '<p class="mensagem-vazia">Nenhum CNAE encontrado para esta busca.</p>';
            return;
        }

        let html = "";
        resultados.forEach(item => {
            // Criei a estrutura exata do seu print. 
            // O href="#" está preparado para quando você quiser linkar para a página interna do CNAE.
            html += `
                <a href="#${item.codigo}" class="item-cnae">
                    <div class="texto-cnae">${item.codigo} - ${item.descricao}</div>
                </a>
            `;
        });
        
        containerLista.innerHTML = html;
    }
</script>
</body>
</html>
