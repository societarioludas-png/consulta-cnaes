<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta CNAE - Ludas Legal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --primary: #1e40af; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; color: #1e293b; }
        .container { max-width: 800px; margin: auto; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 15px; }
        .detalhes-box { display: none; margin-top: 15px; padding: 15px; background: #f1f5f9; border-radius: 6px; font-size: 14px; }
        button { cursor: pointer; padding: 8px 16px; border: none; border-radius: 4px; background: var(--primary); color: white; font-weight: 600; margin-top: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <input type="text" id="campoBusca" placeholder="Pesquisar CNAE..." oninput="filtrar()">
    <div id="lista"></div>
</div>

<script>
    const dados = [
        {c: "6201-5/01", d: "Desenvolvimento de programas", cat: "Tecnologia"},
        {c: "7020-4/00", d: "Consultoria em gestão", cat: "Administrativo"},
        {c: "8630-5/99", d: "Atividades de atenção ambulatorial", cat: "Saúde"}
    ];

    function renderizar(lista) {
        const container = document.getElementById("lista");
        container.innerHTML = "";

        lista.forEach((item, index) => {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <strong>${item.c}</strong> - ${item.d} <br>
                <button onclick="toggleDetalhes(${index})"><i class="fas fa-info"></i> Detalhes</button>
                <button onclick="abrirPagina('${item.c}')"><i class="fas fa-link"></i> Abrir</button>
                <div id="det-${index}" class="detalhes-box">
                    Informações detalhadas sobre a atividade ${item.c}. 
                    Aqui entram os dados de licenciamento e exigências específicas.
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Funções globais obrigatórias para os botões funcionarem
    window.toggleDetalhes = function(index) {
        const el = document.getElementById('det-' + index);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    };

    window.abrirPagina = function(codigo) {
        const url = "/cnae/" + codigo.replace(/[^0-9]/g, '');
        window.open(url, '_blank');
    };

    function filtrar() {
        const termo = document.getElementById("campoBusca").value.toLowerCase();
        const filtrados = dados.filter(i => 
            i.d.toLowerCase().includes(termo) || i.c.includes(termo)
        );
        renderizar(filtrados);
    }

    // Render inicial
    renderizar(dados);
</script>
</body>
</html>
